# Pubblica Nocturna. Se carichi uno zip di Nocturna nel repository, lo estrae da solo,
# poi compila l'app e la pubblica su Firebase. Funziona anche caricando lo zip dal telefono.
name: Pubblica Nocturna

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai lo zip caricato (se presente)
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then echo "Nessuno zip da estrarre."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/z"
          for z in "${zips[@]}"; do unzip -oq "$z" -d "$RUNNER_TEMP/z"; git rm -q --cached "$z" || true; rm -f "$z"; done
          src="$RUNNER_TEMP/z"; [ -d "$src/nocturna" ] && src="$src/nocturna"
          # La cartella .github non viene toccata (GitHub non lo permette) e la configurazione resta quella dei Secrets.
          rm -rf "$src/.git" "$src/.github" "$src/node_modules"
          cp -a "$src"/. ./
          git config user.name "Nocturna"
          git config user.email "nocturna@users.noreply.github.com"
          git add -A
          git commit -qm "Aggiornamento di Nocturna da ${zips[0]}" && git push -q || echo "Nessuna modifica da salvare."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa le dipendenze
        run: npm ci

      - name: Controlla la configurazione e genera le regole di sicurezza
        env:
          ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: node scripts/prepare-deploy.mjs

      - name: Compila l'app
        run: npm run build

      - name: Pubblica su Firebase (app, regole e indici)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Manca il secret FIREBASE_SERVICE_ACCOUNT (vedi README)."; exit 1; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT" --non-interactive --force
