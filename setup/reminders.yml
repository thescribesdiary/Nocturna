# Promemoria: ogni 15 minuti controlla le attività in scadenza e invia le notifiche push.
name: Promemoria Nocturna

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Invia i promemoria
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p "$RUNNER_TEMP/r" && cp scripts/reminders.mjs "$RUNNER_TEMP/r/" && cd "$RUNNER_TEMP/r"
          echo '{"type":"module"}' > package.json
          npm install --silent --no-audit --no-fund firebase-admin@13.10.0
          node reminders.mjs
      - name: Mantieni attivi i promemoria
        # GitHub sospende le esecuzioni programmate dopo 60 giorni senza modifiche al repository.
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "Nocturna"; git config user.email "nocturna@users.noreply.github.com"
            git commit --allow-empty -qm "Mantieni attivi i promemoria" && git push -q
          fi
